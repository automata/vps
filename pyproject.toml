[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vps"
version = "0.1.0"
description = "A Python module to query VPS prices and normalize provisioning across Hetzner Cloud, OVHcloud, and Contabo."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "vps contributors"}]
dependencies = [
  "requests>=2.32,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
  "ovh>=1.2,<2",
  "python-dotenv>=1,<2",
]

[project.scripts]
vps = "vps.cli:app"

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
